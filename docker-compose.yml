services:
  deepseek-harness:
    build: .
    restart: unless-stopped
    ports:
      - "3080:3080"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - dsh-data:/home/node/.dsh
      - ./workspace:/workspace
    networks:
      - dokploy-network

volumes:
  dsh-data:

networks:
  dokploy-network:
    external: true
