services:
  deepseek-harness:
    build: .
    restart: unless-stopped
    ports:
      - 3080:3080
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - dsh-data:/home/node/.dsh
      - ./workspace:/workspace
    networks:
      - dokploy-network
      - default
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # HTTP Router (Redirect to HTTPS)
      - traefik.http.routers.harness-dsh-agzlzv-17-web.rule=Host(`dsh.fixo24.com`)
      - traefik.http.routers.harness-dsh-agzlzv-17-web.entrypoints=web
      - traefik.http.services.harness-dsh-agzlzv-17-web.loadbalancer.server.port=3080
      - traefik.http.routers.harness-dsh-agzlzv-17-web.service=harness-dsh-agzlzv-17-web
      - traefik.http.routers.harness-dsh-agzlzv-17-web.middlewares=redirect-to-https@file

      # Define the Header Spoof Middleware
      - traefik.http.middlewares.dsh-local-headers.headers.customrequestheaders.Host=127.0.0.1:3081
      - traefik.http.middlewares.dsh-local-headers.headers.customrequestheaders.Origin=http://127.0.0.1:3081

      # HTTPS Router (Applies SSL and the local headers middleware)
      - traefik.http.routers.harness-dsh-agzlzv-17-websecure.rule=Host(`dsh.fixo24.com`)
      - traefik.http.routers.harness-dsh-agzlzv-17-websecure.entrypoints=websecure
      - traefik.http.services.harness-dsh-agzlzv-17-websecure.loadbalancer.server.port=3080
      - traefik.http.routers.harness-dsh-agzlzv-17-websecure.service=harness-dsh-agzlzv-17-websecure
      - traefik.http.routers.harness-dsh-agzlzv-17-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.harness-dsh-agzlzv-17-websecure.middlewares=dsh-local-headers

volumes:
  dsh-data: null

networks:
  dokploy-network:
    external: true
