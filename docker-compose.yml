version: '3.8'

services:
  dsh:
    build: .
    restart: unless-stopped
    ports:
      - 3080:3080
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - DSH_TRUSTED_HOSTS=dsh.fixo24.com
      - DSH_AUTH_USERNAME=admin
      - DSH_AUTH_PASSWORD=${DSH_AUTH_PASSWORD}
      - DSH_AUTH_TOKEN=${DSH_AUTH_TOKEN}
    volumes:
      - dsh-data:/home/node/.dsh
      - ./workspace:/workspace
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"

      # 1. Main Web Panel (dsh.fixo24.com)
      - "traefik.http.routers.dsh-web.rule=Host(`dsh.fixo24.com`)"
      - "traefik.http.routers.dsh-web.entrypoints=websecure"
      - "traefik.http.routers.dsh-web.tls=true"
      - "traefik.http.routers.dsh-web.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dsh-web.service=dsh-svc"

      # 2. Settings & Remote API (dsh-api.fixo24.com)
      - "traefik.http.routers.dsh-api.rule=Host(`dsh-api.fixo24.com`)"
      - "traefik.http.routers.dsh-api.entrypoints=websecure"
      - "traefik.http.routers.dsh-api.tls=true"
      - "traefik.http.routers.dsh-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dsh-api.service=dsh-svc"

      # 3. Port & Header Forwarding
      - "traefik.http.services.dsh-svc.loadbalancer.server.port=3080"
      - "traefik.http.services.dsh-svc.loadbalancer.passHostHeader=true"

volumes:
  dsh-data:

networks:
  dokploy-network:
    external: true
